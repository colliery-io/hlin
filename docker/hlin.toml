# The configuration the image ships with.
#
# Replace it. Mount your own over /etc/hlin/hlin.toml, or point HLIN_CONFIG
# somewhere else — the platforms below are examples and the identity settings
# are the minimum a release build will accept, not a recommendation.

# Every interface, which is what a container needs: the shell defaults to
# loopback so a developer running it locally is not on the network by accident,
# and loopback inside a container is the container's own — reachable by nothing.
bind = "0.0.0.0"
port = 8080
issuer = "hlin"

# Bundled with the image, so there is something to look at without building a
# front end. A deployment using its own design pack points this at its own.
frontend = "/home/hlin/frontend"

# Mounted, so a restart keeps the key it signs platform tokens with. Without a
# volume here every restart is a new issuer and every token it minted before
# stops verifying.
key_path = "/home/hlin/state/shell.key"

# Contract memory and the layouts people compose. Without it the shell runs and
# warns: a breaking change shipped across a restart goes unnoticed, which is the
# one thing the versioning exists to catch.
# database_url = "postgres://hlin:hlin@postgres:5432/hlin"

# Certificate authorities to trust on top of the image's own bundle — merged
# with it, never replacing it. Mount the PEM and point this at it. Needed more
# often than it looks: the shell reaches every platform over TLS, and internal
# platforms are usually served from an internal CA. The shell refuses to start
# on a bundle it cannot read, rather than starting with no extra trust and
# failing later against every platform at once.
# ca_bundle = "/etc/hlin-trust/ca.pem"

[auth]
# For an open deployment — public platforms, public data, anybody may look, and
# no identity provider to point at — the strategy is `anonymous`:
#
#   [auth]
#   strategy = "anonymous"
#
# That is the whole of it. Every visitor gets their own identity from a cookie
# the shell sets, so nobody moves anybody else's charts, and the shell refuses
# every write. It therefore shows what has been published and nothing else:
# compose against the same database from a shell configured with one of the
# strategies below, and publish.
#
# `dev` is refused in a release build, on purpose: it makes every request the
# same person. This is the smallest strategy that works, and it means exactly
# what it says — the shell must not be reachable except through the proxy that
# sets these headers, because a header is trivially forged by anything that can
# connect directly.
strategy = "trusted-header"
header = "x-forwarded-user"
groups_header = "x-forwarded-groups"
acknowledge_proxy_required = true

# One per platform the shell should offer panels from.
#
# [[platforms]]
# id = "orebank"
# base_url = "https://orebank.internal"
# auth = { strategy = "hlin-token" }
