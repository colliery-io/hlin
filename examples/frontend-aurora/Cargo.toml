[package]
name = "frontend-aurora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hlin's frontend, drawn by Colliery's Aurora Dark"
publish = false

[[bin]]
name = "frontend-aurora"
path = "src/main.rs"

[dependencies]
# The composition machinery, which knows nothing about any design system.
# Named from crates.io, the way anybody outside this repository would write it.
hlin-ui = "0.0.1"
# The design system, with the feature that makes it a Hlin pack. Vendored
# because that feature is not upstream yet — it could not be until `hlin-view`
# was published, which it now is; see vendor/README.md.
colliery-io-aurora = { path = "../../vendor/aurora-leptos", features = ["hlin"] }
leptos = { workspace = true, features = ["csr"] }
console_error_panic_hook = "0.1"
