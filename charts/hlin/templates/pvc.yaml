{{- if and .Values.persistence.enabled (not .Values.signingKey.existingSecret) }}
# Only when the key is not supplied. With a Secret there is nothing to persist:
# the shell reads the key it was given and writes nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hlin.fullname" . }}-state
  labels:
    {{- include "hlin.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
