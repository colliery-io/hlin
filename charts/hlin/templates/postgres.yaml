{{- if .Values.postgres.enabled }}
{{- $name := printf "%s-postgres" (include "hlin.fullname" .) }}
{{- /*
   Kept across upgrades. Regenerating the password on every `helm upgrade` would
   leave the shell holding a credential the database no longer accepts, which is
   a working install that stops working for no visible reason.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.password | default (and $existing (index $existing.data "password") | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hlin.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  # The whole connection string, so the shell reads one value rather than
  # assembling one from four and getting the escaping wrong.
  url: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.user $password $name .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "hlin.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "hlin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "hlin.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  # One. This is the get-started database, not a replicated one; anything whose
  # loss would matter belongs in a Postgres somebody operates.
  replicas: 1
  selector:
    matchLabels:
      {{- include "hlin.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "hlin.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: password
            # The image initialises into this directory, and mounting a volume
            # at the data root gives it a lost+found it then refuses to start
            # beside.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
