{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hlin.serviceAccountName" . }}
  labels:
    {{- include "hlin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The shell talks to platforms and a database, never to the API server.
automountServiceAccountToken: false
{{- end }}
