# The twenty-widget demo shell (HLIN-I-0012).
#
# Twenty small platforms, each its own crate, process and module, on one
# scrolling surface. `angreal demo up --with twenty` does not read this file
# as it is: it writes demo/state/hlin-twenty.toml, which is this followed by
# one `[[platforms]]` per entry in `WIDGETS` in .angreal/task_demo.py, so the
# list of widgets is written down once. Add a widget there, not here. Each
# `base_url` is the widget's `/hlin` subtree, as on a real host: the root of
# its port is the widget's own UI (HLIN-I-0013).
#
# Everybody is the development user, as in the standard demo: the
# collaborative demo already proves `oidc`, and this one is about how many
# modules one page can hold. The relay that keeps a shared widget in step
# between browsers is per surface, not per person, so one user in two
# browsers shows it as well as two would.

port = 8080
# No public_url: modules are confined to whichever origin the demo was opened
# at, 127.0.0.1 or localhost alike. Right for a shell on one machine; anything
# reachable from others sets it.
issuer = "hlin"
key_path = "demo/state/shell.key"

database_url = "postgres://hlin:hlin@localhost:55432/hlin"

[auth]
strategy = "dev"
sub = "u_dev"
name = "Development User"
groups = ["platform-engineering", "oncall"]

[timings]
poll_seconds = 10
debounce_observations = 2
upstream_timeout_seconds = 10
