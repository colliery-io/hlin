[package]
name = "hlin-widget-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "What a platform needs to host a module, in one place: the scaffolding the twenty widget platforms share"
publish = false

[features]
# What a widget's own tests need to call it as the shell does: a real socket,
# tokens from a real issuer, one per person. A widget turns it on in its
# `[dev-dependencies]`; no binary carries it.
testing = ["dep:reqwest", "dep:futures"]

[dependencies]
async-stream = "0.3"
hlin-manifest = { workspace = true }
hlin-identity = { workspace = true, features = ["axum"] }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `from` and `to` on a series fallback's request, as RFC 3339.
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
# The module files' `ETag`s, from their content.
sha2 = { workspace = true }
# A real socket, as the shell would reach it, so the identity check sees the
# method and path the request actually arrived with.
reqwest = { workspace = true, optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
# This crate's own tests use its `testing` helpers, as every widget's do.
hlin-widget-support = { path = ".", features = ["testing"] }
tokio = { workspace = true }
