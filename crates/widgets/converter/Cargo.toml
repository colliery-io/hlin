[package]
name = "hlin-widget-converter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Widget 19 of twenty: a unit converter that works entirely in its module"
publish = false

[[bin]]
name = "hlin-widget-converter"
path = "src/main.rs"

[lib]
name = "hlin_widget_converter"
path = "src/lib.rs"

[dependencies]
hlin-widget-support = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
hlin-widget-support = { workspace = true, features = ["testing"] }
