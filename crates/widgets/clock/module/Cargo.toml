[package]
name = "hlin-widget-clock-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The clock's own UI: a Leptos module the shell hosts in a frame"
publish = false

[[bin]]
name = "hlin-widget-clock-module"
path = "src/main.rs"

[dependencies]
hlin-widget-module = { workspace = true }
hlin-module = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
# What time the browser thinks it is, which is all a ticking clock needs.
js-sys = "0.3"
