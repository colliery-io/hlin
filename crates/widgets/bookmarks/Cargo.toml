[package]
name = "hlin-widget-bookmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Widget 15 of twenty: shared links"
publish = false

[[bin]]
name = "hlin-widget-bookmarks"
path = "src/main.rs"

[lib]
name = "hlin_widget_bookmarks"
path = "src/lib.rs"

[dependencies]
hlin-widget-support = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
hlin-widget-support = { workspace = true, features = ["testing"] }
