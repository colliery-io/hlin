[package]
name = "hlin-widget-shoutbox-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The shoutbox's own UI: a Leptos module the shell hosts in a frame"
publish = false

[[bin]]
name = "hlin-widget-shoutbox-module"
path = "src/main.rs"

[dependencies]
hlin-widget-module = { workspace = true }
hlin-module = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The browser's clock, to show when something was said in its own time.
js-sys = "0.3"
