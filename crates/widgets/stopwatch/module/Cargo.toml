[package]
name = "hlin-widget-stopwatch-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The stopwatch's own UI: a Leptos module the shell hosts in a frame"
publish = false

[[bin]]
name = "hlin-widget-stopwatch-module"
path = "src/main.rs"

[dependencies]
hlin-widget-module = { workspace = true }
hlin-module = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
# The browser's clock, which is what the stopwatch counts on with between fetches.
js-sys = "0.3"
