[package]
name = "hlin-sample-feed-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The feed's own UI: a Leptos module the shell hosts in a frame"
publish = false

[[bin]]
name = "hlin-sample-feed-module"
path = "src/main.rs"

[dependencies]
hlin-module = { workspace = true }
colliery-io-aurora = "0.2"
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Reading the times the feed sends. No clock feature: the module asks the
# browser what time it is, through `js-sys`.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
js-sys = "0.3"
# Runs `main`'s wait for `init`. Leptos's own `spawn_local` needs the executor
# that `mount_to_body` starts, and nothing is mounted until `init` arrives.
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
