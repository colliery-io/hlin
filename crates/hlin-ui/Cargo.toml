[package]
name = "hlin-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Hlin frontend: the surface people compose, watch and share"
readme = "README.md"

[lib]
name = "hlin_ui"
path = "src/lib.rs"


[dependencies]
hlin-manifest = { workspace = true }
hlin-view = { workspace = true }
hlin-stream = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Window", "Location", "History", "Element", "DomRect", "HtmlInputElement", "HtmlSelectElement"] }
wasm-bindgen = "0.2"
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
# Fanning out the options requests a surface needs, rather than making a
# person wait for them one after another.
futures = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
hlin-manifest = { workspace = true }
hlin-view = { workspace = true }
hlin-stream = { workspace = true }
