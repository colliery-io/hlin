[package]
name = "hlin-sample-checklist-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The checklist's own UI: a Leptos module the shell hosts in a frame"
publish = false

[[bin]]
name = "hlin-sample-checklist-module"
path = "src/main.rs"

[dependencies]
hlin-module = { workspace = true }
colliery-io-aurora = "0.3.1"
leptos = { workspace = true, features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Runs `main`'s wait for `init`. Leptos's own `spawn_local` needs the executor
# that `mount_to_body` starts, and nothing is mounted until `init` arrives.
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
