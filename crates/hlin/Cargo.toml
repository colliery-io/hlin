[package]
name = "hlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Hlin composition shell"

[lib]
name = "hlin"
path = "src/lib.rs"

[[bin]]
name = "hlin"
path = "src/main.rs"

[dependencies]
hlin-manifest = { workspace = true }
hlin-view = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
hlin-identity = { workspace = true }
hlin-stream = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
futures = "0.3"
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
jsonwebtoken = { workspace = true }
bytes = "1"
async-stream = "0.3"

[dev-dependencies]
# `oneshot` drives the real router in a test without binding a port, so routing
# and extraction are part of what the layout tests exercise.
tower = { version = "0.5", features = ["util"] }
