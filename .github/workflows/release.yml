name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: hlin-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: hlin-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: hlin-darwin-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: tar czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release hlin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  image:
    name: Container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # A native runner rather than emulation. This image compiles Rust
            # twice — once native, once to wasm — and under QEMU that is hours
            # rather than minutes.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image carries a front end; the tarballs do not. A binary that
      # starts, serves the API and has nothing to look at is not a thing
      # somebody can deploy, and building a front end needs the repository,
      # trunk and the wasm toolchain.
      #
      # Built per architecture and pushed by digest, with the tags applied
      # afterwards by `manifest` below. Tagging here would have each build
      # overwrite the other, which is how the first release shipped an
      # amd64-only image: it pulled fine on the runner that made it and not at
      # all on an arm64 node or an Apple Silicon laptop.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Container image (manifest)
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both spellings of the version, because two things name this image and
      # they do not agree on the `v`. A git tag is `v0.0.1`; the chart's
      # appVersion is `0.0.1`, because the chart job strips the prefix — and
      # `image.tag` defaults to appVersion. Pushing only `${{ github.ref_name }}`
      # meant a first `helm install` resolved a tag that was never pushed, and
      # got an ImagePullBackOff.
      - name: The version, both ways
        id: version
        run: echo "bare=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: One tag over both architectures
        run: |
          set -euo pipefail
          cd /tmp/digests
          image="ghcr.io/${{ github.repository }}"
          digests=$(printf "${image}@sha256:%s " *)

          for tag in "${{ steps.version.outputs.bare }}" "${{ github.ref_name }}" latest; do
            docker buildx imagetools create --tag "${image}:${tag}" ${digests}
          done

      - name: Say what is in it
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.bare }}"

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Rendering is the test. A chart that lints and renders every shape it
      # offers — both authenticators, with and without a shared signing key,
      # with and without an ingress — is a chart whose refusals have been
      # exercised rather than assumed.
      - name: Lint and render
        run: |
          helm lint charts/hlin --set config.auth.trustedHeader.acknowledgeProxyRequired=true
          helm template t charts/hlin --set config.auth.trustedHeader.acknowledgeProxyRequired=true > /dev/null
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set replicaCount=3 --set signingKey.existingSecret=k > /dev/null
          helm template t charts/hlin \
            --set config.auth.strategy=oidc \
            --set config.auth.oidc.issuer=https://id.example.com \
            --set config.auth.oidc.clientId=hlin \
            --set config.auth.oidc.publicUrl=https://hlin.example.com \
            --set config.auth.oidc.clientSecret.name=s \
            --set config.auth.oidc.clientSecret.key=k > /dev/null
          printf -- '-----BEGIN CERTIFICATE-----\nnot-a-real-one\n-----END CERTIFICATE-----\n' > /tmp/ca.pem
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set-file config.caBundle.pem=/tmp/ca.pem > /dev/null
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set config.caBundle.existingSecret=corp-ca \
            --set config.caBundle.key=corp.crt > /dev/null
          # Needs nothing else set, which is the claim: no provider, no proxy.
          helm template t charts/hlin --set config.auth.strategy=anonymous > /dev/null
          # Somebody else's design pack, over the one the image was built with.
          helm template t charts/hlin \
            --set config.auth.strategy=anonymous \
            --set config.frontendImage=ghcr.io/example/pack:1.0 > /dev/null

      # And that the refusals refuse. A guard nobody tests is a guard that
      # stops guarding the first time somebody edits around it.
      - name: The refusals refuse
        run: |
          ! helm template t charts/hlin > /dev/null 2>&1 || (echo "should have refused an unacknowledged trusted-header" && exit 1)
          ! helm template t charts/hlin \
              --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
              --set replicaCount=2 > /dev/null 2>&1 || (echo "should have refused replicas without a shared key" && exit 1)
          ! helm template t charts/hlin --set config.auth.strategy=dev > /dev/null 2>&1 || (echo "should have refused dev" && exit 1)
          ! helm template t charts/hlin \
              --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
              --set config.caBundle.existingSecret=a \
              --set config.caBundle.existingConfigMap=b > /dev/null 2>&1 || (echo "should have refused two trust sources" && exit 1)

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published as an OCI artifact beside the image, so one registry holds
      # both halves of a deployment.
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/hlin --version "$version" --app-version "$version"
          helm push "hlin-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Deliberately not a dependency of `release`. A crates.io token that is
    # missing or expired should not swallow the binaries, the image and the
    # chart along with it — this failing on its own is legible; everything
    # failing because of it is not.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add it under Settings → Secrets."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"

          # The order is the dependency graph, and it is encoded rather than
          # remembered because publishing is irreversible per version: a crate
          # pushed before something it depends on cannot be withdrawn and
          # retried, only yanked and bumped.
          #
          #   hlin-manifest, hlin-identity   nothing internal
          #   hlin-view, hlin-stream         on manifest
          #   hlin-ui, hlin-pack-demo        on view and stream
          #   hlin-sample-platform, hlin     on everything
          for crate in hlin-manifest hlin-identity hlin-view hlin-stream \
                       hlin-ui hlin-pack-demo hlin-sample-platform hlin; do

            # Already there? Then this is a re-run of a tag, and a re-run
            # should finish what a half-finished one started rather than
            # failing on the first crate that succeeded last time.
            #
            # The User-Agent is not optional: crates.io refuses a request
            # without one, so this check answered "not published" for
            # everything, including crates that were — which turned the
            # re-run safety it exists for into a job that always died on the
            # first already-published crate.
            if curl -sSf -A "hlin-release (${GITHUB_REPOSITORY})" \
                 "https://crates.io/api/v1/crates/${crate}/${version}" > /dev/null 2>&1; then
              echo "  ${crate} ${version} is already published"
              continue
            fi

            # crates.io rate-limits *new* crates: a burst, then a wait. The
            # first release of a workspace this size hits it — five went
            # through and the sixth was refused — so a run that gives up on
            # the first 429 leaves a half-published release behind.
            echo "  publishing ${crate} ${version}"
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "${crate}"; then
                break
              fi
              if [ "${attempt}" = "6" ]; then
                echo "::error::${crate} ${version} would not publish after ${attempt} attempts"
                exit 1
              fi
              echo "  refused; waiting before attempt $((attempt + 1))"
              sleep 120
            done
          done

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, manifest, chart]
    steps:
      - uses: actions/checkout@v4

      # Only the tarballs. Unscoped, this takes every artifact in the run —
      # which includes the `.dockerbuild` build record `build-push-action`
      # uploads on its own. That one refused to extract and failed the job
      # after the binaries had already downloaded fine, and had it succeeded
      # it would have been attached to the release as though it were one.
      - name: Download the release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: hlin-*.tar.gz
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/hlin-*.tar.gz
