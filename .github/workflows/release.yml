name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: hlin-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: hlin-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: hlin-darwin-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: tar czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release hlin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image carries a front end; the tarballs do not. A binary that
      # starts, serves the API and has nothing to look at is not a thing
      # somebody can deploy, and building a front end needs the repository,
      # trunk and the wasm toolchain.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # Rendering is the test. A chart that lints and renders every shape it
      # offers — both authenticators, with and without a shared signing key,
      # with and without an ingress — is a chart whose refusals have been
      # exercised rather than assumed.
      - name: Lint and render
        run: |
          helm lint charts/hlin --set config.auth.trustedHeader.acknowledgeProxyRequired=true
          helm template t charts/hlin --set config.auth.trustedHeader.acknowledgeProxyRequired=true > /dev/null
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set replicaCount=3 --set signingKey.existingSecret=k > /dev/null
          helm template t charts/hlin \
            --set config.auth.strategy=oidc \
            --set config.auth.oidc.issuer=https://id.example.com \
            --set config.auth.oidc.clientId=hlin \
            --set config.auth.oidc.publicUrl=https://hlin.example.com \
            --set config.auth.oidc.clientSecret.name=s \
            --set config.auth.oidc.clientSecret.key=k > /dev/null
          printf -- '-----BEGIN CERTIFICATE-----\nnot-a-real-one\n-----END CERTIFICATE-----\n' > /tmp/ca.pem
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set-file config.caBundle.pem=/tmp/ca.pem > /dev/null
          helm template t charts/hlin \
            --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
            --set config.caBundle.existingSecret=corp-ca \
            --set config.caBundle.key=corp.crt > /dev/null

      # And that the refusals refuse. A guard nobody tests is a guard that
      # stops guarding the first time somebody edits around it.
      - name: The refusals refuse
        run: |
          ! helm template t charts/hlin > /dev/null 2>&1 || (echo "should have refused an unacknowledged trusted-header" && exit 1)
          ! helm template t charts/hlin \
              --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
              --set replicaCount=2 > /dev/null 2>&1 || (echo "should have refused replicas without a shared key" && exit 1)
          ! helm template t charts/hlin --set config.auth.strategy=dev > /dev/null 2>&1 || (echo "should have refused dev" && exit 1)
          ! helm template t charts/hlin \
              --set config.auth.trustedHeader.acknowledgeProxyRequired=true \
              --set config.caBundle.existingSecret=a \
              --set config.caBundle.existingConfigMap=b > /dev/null 2>&1 || (echo "should have refused two trust sources" && exit 1)

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published as an OCI artifact beside the image, so one registry holds
      # both halves of a deployment.
      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package charts/hlin --version "$version" --app-version "$version"
          helm push "hlin-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, image, chart]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
