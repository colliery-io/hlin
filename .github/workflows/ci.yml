name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --lib -- --test-threads=1

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --workspace --test integration -- --test-threads=1

  test-functional:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run functional tests
        run: cargo test --workspace --test functional -- --test-threads=1

      - name: Run ignored tests (external services)
        run: cargo test --workspace --test functional -- --test-threads=1 --ignored
        continue-on-error: true

  test-store:
    name: All Tests (with database)
    runs-on: ubuntu-latest
    needs: check
    # The jobs above run the targets named integration and functional. This one
    # runs every test target in the workspace, so a new one is covered the day
    # it is added rather than the day someone notices. It also provides the
    # database the store suite needs: the in-memory store is a test double, and
    # a double is only worth having while it agrees with the real thing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hlin
          POSTGRES_PASSWORD: hlin
          POSTGRES_DB: hlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hlin -d hlin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HLIN_TEST_DATABASE_URL: postgres://hlin:hlin@localhost:5432/hlin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run every test target
        run: cargo test --workspace -- --test-threads=1

      - name: Run tests that need a database
        run: cargo test --workspace -- --test-threads=1 --ignored

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-functional]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace --no-report -- --test-threads=1
          cargo llvm-cov report --workspace --html --output-dir coverage/
          cargo llvm-cov report --workspace --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --workspace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release
