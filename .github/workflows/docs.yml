# Builds the Starlight site in docs/ on each pull request, and publishes it to
# GitHub Pages on a push to main (HLIN-T-0107). The API reference is rendered
# by plissken (plissken.toml) before the build; it is not in git.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'plissken.toml'
      - 'crates/*/src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'plissken.toml'
      - 'crates/*/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PLISSKEN_VERSION: 0.2.0
  PLISSKEN_SHA256: 2166e15d69bd891959704a0f70c60724ccae4615584a70b4e524ed4c9460e253

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install plissken
        run: |
          tarball="plissken-${PLISSKEN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLO "https://github.com/colliery-io/plissken/releases/download/v${PLISSKEN_VERSION}/${tarball}"
          echo "${PLISSKEN_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/plissken"
          tar -xzf "${tarball}" -C "$RUNNER_TEMP/plissken"
          echo "$RUNNER_TEMP/plissken" >> "$GITHUB_PATH"

      - name: Generate API docs
        run: plissken render

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: Install dependencies
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: Build site
        working-directory: docs
        run: npm run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
